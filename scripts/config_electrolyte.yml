general:
  device: cuda
  output: electrolyte_model_les
  precision: double
  seed: 0

data:
  train_root: electrolyte_data/train
  test_root: electrolyte_data/test
  train_size: 1500    # leaves 100 frames for validation
  val_size: null
  test_size: null
  stats_size: null
  train_batch_size: 2    # frames up to 700 atoms — keep batches small
  val_batch_size: 2
  test_batch_size: 2
  force_reload: False
  in_memory: False    # too large to fit in memory
  data_length_unit: Ang
  data_energy_unit: eV

model:
  cutoff: 5.0
  n_basis: 20
  n_features: 128
  n_interactions: 3
  activation: swish
  output_properties: ['charge', 'energy', 'gradient_force']
  les_args:
    use_atomwise: false
    sigma: 1.0
    dl: 2.0
    remove_mean: true
    epsilon_factor: 1.0
    is_periodic: true
    N_max: 10

training:
  fit_scalers:
    fit_scale: True
    fit_shift: True
  loss:
    energy:
      weight: 1.0
      mode: mse
      per_atom: true
    gradient_force:
      weight: 50.0
      mode: mse
  optimizer:
    adam:
      lr: 1.0e-3
  lr_scheduler:
    plateau:
      patience: 15
      factor: 0.7
      min_lr: 1.0e-5
  epochs: 1000
  clip_grad: 1.0
  checkpoint:
    check_val: 1
    check_test: 10
    check_log: 10
